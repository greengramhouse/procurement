// จำนวนเงินเป็นตัวอักษรไทย
function bahtText(num){
  const d=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], p=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const readGroup = s => { s=String(Number(s)); if(s==='0') return ''; let out=''; const L=s.length;
    for(let i=0;i<L;i++){ const n=+s[i], pos=L-1-i; if(n===0) continue;
      if(pos===1&&n===1) out+='สิบ'; else if(pos===1&&n===2) out+='ยี่สิบ';
      else if(pos===0&&n===1&&L>1) out+='เอ็ด'; else out+=d[n]+p[pos]; }
    return out; };
  const readInt = s => { if(Number(s)===0) return 'ศูนย์'; const groups=[]; while(s.length>6){ groups.unshift(s.slice(-6)); s=s.slice(0,-6);} groups.unshift(s);
    return groups.map(g=>readGroup(g)).join('ล้าน').replace(/ล้าน$/, 'ล้าน'); };
  const [i, f=''] = Number(num).toFixed(2).split('.');
  const sat = Number(f);
  return readInt(i) + 'บาท' + (sat ? readGroup(String(sat)) + 'สตางค์' : 'ถ้วน');
}

let reqItems = [['กระดาษ A4 80 แกรม',40,'รีม',125],['หมึกพิมพ์เลเซอร์ (ดำ)',6,'ตลับ',2350],['แฟ้มเอกสาร',50,'เล่ม',45]];
function renderRows(){
  const tb=document.getElementById('itemRows'); if(!tb) return;
  tb.innerHTML = reqItems.map((r,i)=>`<tr class="border-b border-slate-100">
    <td class="py-2 pr-2"><input class="w-full rounded border border-slate-300 px-2 py-1.5" value="${r[0]}" oninput="reqItems[${i}][0]=this.value"></td>
    <td class="pr-2"><input type="number" min="0" class="w-full rounded border border-slate-300 px-2 py-1.5" value="${r[1]}" oninput="reqItems[${i}][1]=+this.value;calcReq()"></td>
    <td class="pr-2"><input class="w-full rounded border border-slate-300 px-2 py-1.5" value="${r[2]}" oninput="reqItems[${i}][2]=this.value"></td>
    <td class="pr-2"><input type="number" min="0" class="w-full rounded border border-slate-300 px-2 py-1.5" value="${r[3]}" oninput="reqItems[${i}][3]=+this.value;calcReq()"></td>
    <td class="text-right tabular-nums" id="sub${i}">${fmt(r[1]*r[3])}</td>
    <td class="text-center"><button class="text-slate-400 hover:text-red-500" onclick="reqItems.splice(${i},1);renderRows()" aria-label="ลบ">✕</button></td></tr>`).join('');
  calcReq();
}
function addRow(){ reqItems.push(['',1,'',0]); renderRows(); }
function calcReq(){
  const total = reqItems.reduce((a,r)=>a+r[1]*r[3],0);
  reqItems.forEach((r,i)=>{ const el=document.getElementById('sub'+i); if(el) el.textContent=fmt(r[1]*r[3]); });
  const el=document.getElementById('reqTotal'); if(!el) return;
  el.textContent = baht(total);
  document.getElementById('reqText').textContent = '(' + bahtText(total) + ')';
  const fsel=document.getElementById('fundSel'); const f = FUNDS.find(x=>x.name===fsel.value) || FUNDS[0];
  const left=f.budget-f.used;
  let method, note;
  if(total<=50000){ method='วิธีเฉพาะเจาะจง · รายงานขอซื้อแบบย่อ'; note='ไม่เกิน 50,000 บาท (ตามเกณฑ์ ว 804 ที่ตั้งค่าไว้) · ผู้จัดซื้อตรวจรับเองได้ · ประกาศผลรายไตรมาส'; }
  else if(total<=100000){ method='วิธีเฉพาะเจาะจง'; note='ไม่เกิน 100,000 บาท · แต่งตั้งผู้ตรวจรับ 1 คนได้ · ดำเนินการผ่าน e-GP'; }
  else if(total<=500000){ method='วิธีเฉพาะเจาะจง'; note='เกิน 100,000 บาท · ต้องตั้งคณะกรรมการตรวจรับ · ดำเนินการผ่าน e-GP'; }
  else { method='e-market / e-bidding'; note='เกิน 500,000 บาท · ดำเนินการในระบบ e-GP'; }
  const ok = total<=left;
  document.getElementById('reqCheck').innerHTML = `
    <div class="rounded-lg bg-brand-50 p-3"><div class="text-xs text-slate-500">วิธีจัดหาที่ระบบแนะนำ</div><div class="font-semibold text-brand-700">${method}</div><div class="mt-1 text-xs text-slate-600">${note}</div></div>
    <div class="rounded-lg ${ok?'bg-emerald-50':'bg-red-50'} p-3"><div class="text-xs text-slate-500">งบคงเหลือ: ${f.name}</div><div class="font-semibold ${ok?'text-emerald-700':'text-red-700'}">${baht(left)} ${ok?'· เพียงพอ':'· ไม่พอ'}</div></div>
    <div class="rounded-lg bg-amber-50 p-3"><div class="text-xs text-slate-500">ตรวจการแบ่งซื้อ</div><div class="text-amber-700">พบการซื้อวัสดุสำนักงาน 1 ครั้งในรอบ 30 วัน (฿12,500) · รวมแล้วยังไม่เกินเกณฑ์</div></div>`;
}

// ---------- router ----------
const TITLES = { detail:'รายละเอียดเรื่อง' };
MENU.forEach(g=>g.items.forEach(it=>TITLES[it.id]=it.label));
const GROUP_OF = { detail:'งานจัดซื้อจัดจ้าง' };
MENU.forEach(g=>g.items.forEach(it=>GROUP_OF[it.id]=g.group));

function allowed(id){ if(id==='detail') return true; for(const g of MENU) for(const it of g.items) if(it.id===id) return it.roles.includes(role); return false; }

function renderNav(current){
  document.getElementById('nav').innerHTML = MENU.map(g=>{
    const items = g.items.filter(it=>it.roles.includes(role));
    if(!items.length) return '';
    return `<div class="mb-4"><div class="px-3 pb-1.5 text-xs font-semibold uppercase tracking-wide text-slate-400">${g.group}</div>
      ${items.map(it=>`<a href="#${it.id}" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 ${current===it.id||(current==='detail'&&it.id==='register')?'active':''}">
        <span class="text-slate-400">${icon(it.icon)}</span><span class="flex-1">${it.label}</span>${it.badge?`<span class="rounded-full bg-red-500 px-1.5 text-xs text-white">${it.badge}</span>`:''}</a>`).join('')}</div>`;
  }).join('');
}

function render(){
  let id = location.hash.slice(1) || 'dashboard';
  if(!PAGES[id] || !allowed(id)) id = 'dashboard';
  renderNav(id);
  document.getElementById('pageTitle').textContent = TITLES[id];
  document.getElementById('crumb').textContent = GROUP_OF[id] + ' / ' + TITLES[id];
  document.getElementById('page').innerHTML = PAGES[id]();
  document.getElementById('userName').textContent = ROLES[role].user;
  document.getElementById('userRole').textContent = ROLES[role].label;
  document.getElementById('avatar').textContent = ROLES[role].user.replace(/^(นาย|นางสาว|นาง)/,'').slice(0,1);
  if(id==='request') renderRows();
  closeMenu();
  window.scrollTo(0,0);
}
function go(id){ if(location.hash==='#'+id) render(); else location.hash = id; }

const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
function closeMenu(){ sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
document.getElementById('menuBtn').onclick=()=>{ sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); };
overlay.onclick=closeMenu;
document.getElementById('roleSelect').onchange=e=>{ role=e.target.value; render(); toast('สลับเป็น: '+ROLES[role].label); };
window.addEventListener('hashchange', render);
render();
</script>
